spring.application.name=CivicAssist

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/civicassist
spring.datasource.username=civicassist_user
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Server
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info

app.jwt.secret=${JWT_SECRET_BASE64}
