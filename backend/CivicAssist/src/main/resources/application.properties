spring.application.name=CivicAssist

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/civicassist
spring.datasource.username=civicassist_user
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# Server
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info

app.jwt.secret=${JWT_SECRET_BASE64}

#AI
spring.ai.model.chat=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.6-flash

# Duplicate complaint detection
civicassist.duplicates.threshold=60
civicassist.duplicates.max-candidates=500

# Complaint attachment storage
civicassist.attachments.storage-dir=${ATTACHMENT_STORAGE_DIR:./data/complaint-attachments}

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=27MB

# Notification retention
app.notifications.retention.read-days=30
app.notifications.retention.unread-days=90

# Notification cleanup
app.notifications.cleanup.batch-size=1000
app.notifications.cleanup.cron=0 0 2 * * *

spring.kafka.bootstrap-servers=localhost:29092

# Producer: Java String -> Kafka bytes
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Consumer: Kafka bytes -> Java String
spring.kafka.consumer.group-id=civicassist-test-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer